<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8eaff">
<title>ふたりの不思議な生き物図鑑</title>
<style>
:root{--pink:#ffd8ec;--blue:#d9f5ff;--ink:#594d70}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#fff 0 7%,transparent 30%),linear-gradient(145deg,var(--blue),var(--pink));display:grid;place-items:center;padding:24px}
main{width:min(100%,440px);text-align:center;background:#ffffffc9;border:1px solid #fff;border-radius:30px;padding:28px 22px 30px;box-shadow:0 16px 45px #9b83bd30}
.kicker{letter-spacing:.16em;font-size:11px;color:#9c82b5;font-weight:700}.title{font-size:27px;line-height:1.45;margin:10px 0 4px}.sub{font-size:12px;letter-spacing:.12em;color:#a18caf}
.status{display:inline-flex;align-items:center;gap:7px;margin:20px 0 8px;padding:8px 13px;border-radius:30px;background:#f3eafa;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#e5ad62}
.creature{height:190px;display:grid;place-items:center;font-size:112px;filter:drop-shadow(0 12px 10px #a78ab344);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
.name{font-weight:700;font-size:17px;min-height:26px}.hint{font-size:12px;color:#9a8ba9;margin:8px 0 22px}
button{width:100%;border:0;border-radius:18px;padding:16px;margin-top:10px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(100deg,#91d9ee,#e9a8d2);box-shadow:0 7px 16px #b99acb40}
button.secondary{background:#fff;color:#8d78a6;border:1px solid #eadcf3;box-shadow:none}
.note{font-size:11px;color:#a394b0;line-height:1.7;margin:18px 4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#554b65;color:white;padding:12px 18px;border-radius:24px;font-size:13px;opacity:0;transition:.25s;white-space:nowrap}.toast.show{opacity:1}
</style>
</head>
<body>
<main>
<div class="kicker">A LITTLE MAGIC FOR TWO</div>
<h1 class="title">ふたりの不思議な<br>生き物図鑑</h1>
<div class="sub">MAGIC CREATURES</div>
<div class="status"><span class="dot"></span> 接続準備中</div>
<div class="creature" id="creature" aria-label="ふしぎな生き物">🫧</div>
<div class="name" id="creatureName">まだ生き物はいないよ</div>
<p class="hint" id="hint">ふたりだけの小さな生き物を誕生させよう</p>
<button id="birth">✨ 生き物を誕生させる</button>
<button class="secondary" id="send">🪽 翼に送る</button>
<p class="note">これは試作版だよ。今はこの画面で生き物を誕生させるところまで。<br>ふたりのiPhoneをつなぐ機能は、これから作っていくよ。</p>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const creatures=[["🦋","ゆめいろバタフライ"],["🐉","ほしふるミニドラゴン"],["🪼","ふわふわクラゲ"],["🦄","ミルキー・ユニコーン"],["🐈","月あかりのこねこ"],["🐇","わたぐものうさぎ"],["🐬","しずくのイルカ"],["🐣","ひかりのたまご"]];
let born=false;
const toast=document.getElementById("toast");
function message(text){toast.textContent=text;toast.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove("show"),2400)}
document.getElementById("birth").addEventListener("click",()=>{const c=creatures[Math.floor(Math.random()*creatures.length)];document.getElementById("creature").textContent=c[0];document.getElementById("creatureName").textContent=c[1];document.getElementById("hint").textContent="新しい仲間が誕生したよ！";born=true;});
document.getElementById("send").addEventListener("click",()=>{message(born?"送信機能は次のステップでつなげるよ 🪽":"先に生き物を誕生させてね ✨");});
</script>
</body>
</html>
